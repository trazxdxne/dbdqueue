name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            output_name: dbdq-linux-x86_64
            archive_name: dbdq-linux-x86_64.tar.gz
            os: ubuntu-latest
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            output_name: dbdq-linux-aarch64
            archive_name: dbdq-linux-aarch64.tar.gz
            os: ubuntu-latest
            use_cross: true
          - target: x86_64-pc-windows-msvc
            output_name: dbdq-windows-x64.exe
            archive_name: dbdq-windows-x64.zip
            os: windows-latest
            use_cross: false

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross Toolchain
        if: matrix.use_cross
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}

      - name: Build binary
        shell: bash
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package release assets
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp target/${{ matrix.target }}/release/dbdq.exe dist/${{ matrix.output_name }}
            cp target/${{ matrix.target }}/release/dbdq.exe dbdq.exe
            7z a -tzip dist/${{ matrix.archive_name }} dbdq.exe README.md LICENSE
          else
            cp target/${{ matrix.target }}/release/dbdq dist/${{ matrix.output_name }}
            cp target/${{ matrix.target }}/release/dbdq dbdq
            tar -czvf dist/${{ matrix.archive_name }} dbdq README.md LICENSE
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.target }}
          path: dist/*

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: assets-*
          path: release-assets
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd release-assets
          sha256sum dbdq* > SHA256SUMS.txt
          echo "Generated SHA256 Checksums:"
          cat SHA256SUMS.txt

      - name: Extract Release Notes
        id: changelog
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "## Dead By Queue v$VERSION" > release_notes.md
          echo "" >> release_notes.md
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { flag=1; next }
            /^## \[/ { flag=0 }
            flag { print }
          ' CHANGELOG.md >> release_notes.md

          if [ ! -s release_notes.md ] || [ $(wc -l < release_notes.md) -le 2 ]; then
            echo "Release v$VERSION" >> release_notes.md
          fi

      - name: Clean up obsolete legacy release assets
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Cleaning obsolete assets for $TAG..."
          for file in dbdqueue-linux-aarch64 dbdqueue-linux-x86_64 dbdqueue-windows-x64.exe install.ps1 install.sh; do
            gh release delete-asset "$TAG" "$file" --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
          body_path: release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
