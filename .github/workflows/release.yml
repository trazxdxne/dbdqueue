name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            output_name: dbdq-linux-x86_64
            os: ubuntu-latest
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            output_name: dbdq-linux-aarch64
            os: ubuntu-latest
            use_cross: true
          - target: x86_64-pc-windows-msvc
            output_name: dbdq-windows-x64.exe
            os: windows-latest
            use_cross: false

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross Toolchain
        if: matrix.use_cross
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}

      - name: Build binary
        shell: bash
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare asset
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp target/${{ matrix.target }}/release/dbdq.exe ${{ matrix.output_name }}
          else
            cp target/${{ matrix.target }}/release/dbdq ${{ matrix.output_name }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output_name }}
          path: ${{ matrix.output_name }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Move artifacts to root
        run: |
          mv artifacts/dbdq-linux-x86_64/dbdq-linux-x86_64 .
          mv artifacts/dbdq-linux-aarch64/dbdq-linux-aarch64 .
          mv artifacts/dbdq-windows-x64.exe/dbdq-windows-x64.exe .

      - name: Extract Release Notes
        id: changelog
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "## Dead By Queue v$VERSION" > release_notes.md
          awk -v ver="$VERSION" '/^## \[/ { if ($0 ~ "^## \\[" ver "\\]") flag=1; else flag=0; next } flag' CHANGELOG.md >> release_notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dbdq-linux-x86_64
            dbdq-linux-aarch64
            dbdq-windows-x64.exe
          body_path: release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
