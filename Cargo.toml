[package]
name = "dbdqueue"
version = "0.9.0"
edition = "2024"
description = "Terminal queue times viewer and matchmaking region locker for Dead by Daylight"
license = "MIT"
repository = "https://github.com/trazxdxne/dbdqueue"
readme = "README.md"
categories = ["command-line-utilities", "games"]
keywords = ["dead-by-daylight", "dbd", "queue", "tui", "matchmaking"]

[[bin]]
name = "dbdq"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
ureq = "2.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
crossterm = "0.29"
regex = "1.10"
chrono = "0.4"
ratatui = "0.30.1"
sys-locale = "0.3.2"


