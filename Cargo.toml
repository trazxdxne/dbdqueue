[package]
name = "dbdqueue"
version = "0.5.4"
edition = "2024"

[[bin]]
name = "dbdq"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
ureq = "2.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
crossterm = "0.27"
regex = "1.10"
chrono = "0.4"
ratatui = "0.30.1"


