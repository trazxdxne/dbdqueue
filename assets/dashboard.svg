<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#181825"/>
    </linearGradient>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Cascadia Code', 'SF Mono', 'Fira Code', Menlo, Consolas, monospace; }
      .bold { font-weight: 700; }
      .red-accent { fill: #f38ba8; }
      .green-accent { fill: #a6e3a1; }
      .yellow-accent { fill: #f9e2af; }
      .red-status { fill: #f38ba8; }
      .text-light { fill: #cdd6f4; }
      .text-muted { fill: #6c7086; }
      .text-dim { fill: #9399b2; }
      .border-gray { stroke: #45475a; stroke-width: 1.2; fill: none; }
    </style>
  </defs>

  <!-- Terminal Window Container -->
  <rect x="20" y="16" width="840" height="508" rx="10" ry="10" fill="url(#bgGrad)" filter="url(#shadow)"/>
  <rect x="20" y="16" width="840" height="508" rx="10" ry="10" stroke="#313244" stroke-width="1" fill="none"/>

  <!-- Window Titlebar -->
  <rect x="20" y="16" width="840" height="38" rx="10" ry="10" fill="#11111b"/>
  <rect x="20" y="44" width="840" height="10" fill="#11111b"/>
  <line x1="20" y1="54" x2="860" y2="54" stroke="#313244" stroke-width="1"/>

  <!-- Window Controls -->
  <circle cx="42" cy="35" r="6" fill="#ff5f56"/>
  <circle cx="62" cy="35" r="6" fill="#ffbd2e"/>
  <circle cx="82" cy="35" r="6" fill="#27c93f"/>

  <!-- Terminal Title -->
  <text x="440" y="39" class="mono text-muted" font-size="12" text-anchor="middle" letter-spacing="0.5">dbdq — Dead By Queue</text>

  <!-- Single Outer TUI Border -->
  <rect x="38" y="68" width="804" height="438" rx="4" class="border-gray"/>
  <rect x="52" y="61" width="122" height="14" fill="#1e1e2e"/>
  <text x="58" y="72" class="mono bold red-accent" font-size="12"> Dead By Queue </text>

  <!-- Header Strip -->
  <text x="58" y="95" class="mono text-muted" font-size="13">Sort: <tspan class="bold text-light">Killer ▲</tspan><tspan class="text-muted">  │  </tspan>Mode: <tspan class="bold text-light">Standard</tspan><tspan class="text-muted">  │  </tspan>Time: <tspan class="bold text-light">Exact</tspan><tspan class="text-muted">  │  </tspan>Lock: <tspan class="bold green-accent">Active (2)</tspan></text>

  <!-- Best Pick Hero Card -->
  <rect x="58" y="114" width="596" height="72" rx="3" class="border-gray"/>
  <rect x="70" y="107" width="86" height="14" fill="#1d1d2d"/>
  <text x="74" y="118" class="mono bold red-accent" font-size="12"> Best Pick </text>

  <text x="74" y="142" class="mono text-muted" font-size="13">Killer:</text>
  <text x="164" y="142" class="mono green-accent" font-size="13">0:18</text>
  <text x="232" y="142" class="mono bold text-light" font-size="13">[DE] Frankfurt<tspan class="green-accent bold"> ●</tspan></text>
  <text x="388" y="142" class="mono green-accent" font-size="13">28 ms</text>
  <text x="466" y="142" class="mono text-muted" font-size="13">+2 similar</text>

  <text x="74" y="167" class="mono text-muted" font-size="13">Survivor:</text>
  <text x="164" y="167" class="mono green-accent" font-size="13">0:42</text>
  <text x="232" y="167" class="mono bold text-light" font-size="13">[DE] Frankfurt<tspan class="green-accent bold"> ●</tspan></text>
  <text x="388" y="167" class="mono green-accent" font-size="13">28 ms</text>
  <text x="466" y="167" class="mono text-muted" font-size="13">+1 similar</text>

  <!-- Borderless Queue Table -->
  <text x="58" y="214" class="mono bold text-light" font-size="13">Region</text>
  <text x="336" y="214" class="mono bold text-light" font-size="13" text-anchor="end">Ping</text>
  <text x="490" y="214" class="mono bold text-light" font-size="13" text-anchor="end">Survivor</text>
  <text x="644" y="214" class="mono bold red-accent" font-size="13" text-anchor="end">Killer ▲</text>

  <!-- Row 1: Selected Row Highlight -->
  <rect x="54" y="227" width="596" height="24" rx="3" fill="#313244" opacity="0.85"/>
  <text x="58" y="244" class="mono bold text-light" font-size="13">[DE] Frankfurt<tspan class="green-accent bold"> ●</tspan></text>
  <text x="336" y="244" class="mono bold green-accent" font-size="13" text-anchor="end">28 ms</text>
  <text x="490" y="244" class="mono bold green-accent" font-size="13" text-anchor="end">0:42</text>
  <text x="644" y="244" class="mono bold green-accent" font-size="13" text-anchor="end">0:18</text>

  <!-- Row 2 -->
  <text x="58" y="270" class="mono bold text-light" font-size="13">[IE] Dublin<tspan class="green-accent bold"> ●</tspan></text>
  <text x="336" y="270" class="mono green-accent" font-size="13" text-anchor="end">34 ms</text>
  <text x="490" y="270" class="mono yellow-accent" font-size="13" text-anchor="end">1:15</text>
  <text x="644" y="270" class="mono green-accent" font-size="13" text-anchor="end">0:24</text>

  <!-- Row 3 -->
  <text x="58" y="296" class="mono text-light" font-size="13">[GB] London</text>
  <text x="336" y="296" class="mono green-accent" font-size="13" text-anchor="end">36 ms</text>
  <text x="490" y="296" class="mono green-accent" font-size="13" text-anchor="end">0:55</text>
  <text x="644" y="296" class="mono green-accent" font-size="13" text-anchor="end">0:31</text>

  <!-- Row 4 -->
  <text x="58" y="322" class="mono text-light" font-size="13">[US] Virginia</text>
  <text x="336" y="322" class="mono yellow-accent" font-size="13" text-anchor="end">98 ms</text>
  <text x="490" y="322" class="mono yellow-accent" font-size="13" text-anchor="end">2:10</text>
  <text x="644" y="322" class="mono yellow-accent" font-size="13" text-anchor="end">1:05</text>

  <!-- Row 5 -->
  <text x="58" y="348" class="mono text-light" font-size="13">[US] Oregon</text>
  <text x="336" y="348" class="mono yellow-accent" font-size="13" text-anchor="end">142 ms</text>
  <text x="490" y="348" class="mono red-status" font-size="13" text-anchor="end">3:45</text>
  <text x="644" y="348" class="mono yellow-accent" font-size="13" text-anchor="end">1:20</text>

  <!-- Row 6 -->
  <text x="58" y="374" class="mono text-light" font-size="13">[BR] São Paulo</text>
  <text x="336" y="374" class="mono yellow-accent" font-size="13" text-anchor="end">185 ms</text>
  <text x="490" y="374" class="mono red-status" font-size="13" text-anchor="end">4:12</text>
  <text x="644" y="374" class="mono yellow-accent" font-size="13" text-anchor="end">2:50</text>

  <!-- Row 7 -->
  <text x="58" y="400" class="mono text-light" font-size="13">[JP] Tokyo</text>
  <text x="336" y="400" class="mono yellow-accent" font-size="13" text-anchor="end">210 ms</text>
  <text x="490" y="400" class="mono red-status" font-size="13" text-anchor="end">5:30</text>
  <text x="644" y="400" class="mono red-status" font-size="13" text-anchor="end">4:15</text>

  <!-- Row 8 -->
  <text x="58" y="426" class="mono text-light" font-size="13">[KR] Seoul</text>
  <text x="336" y="426" class="mono red-status" font-size="13" text-anchor="end">258 ms</text>
  <text x="490" y="426" class="mono red-status" font-size="13" text-anchor="end">6:10</text>
  <text x="644" y="426" class="mono red-status" font-size="13" text-anchor="end">5:02</text>

  <!-- Vertical Table Scrollbar -->
  <line x1="664" y1="230" x2="664" y2="432" stroke="#45475a" stroke-width="1.5"/>
  <rect x="662" y="230" width="4" height="104" rx="2" fill="#6c7086"/>

  <!-- Footer Strip -->
  <text x="58" y="488" class="mono" font-size="12">
    <tspan class="text-muted">API Updated: just now  │  </tspan><tspan class="red-accent bold">↑↓/jk</tspan><tspan class="text-dim"> Select</tspan><tspan class="text-muted"> · </tspan><tspan class="red-accent bold">L</tspan><tspan class="text-dim"> Lock</tspan><tspan class="text-muted"> · </tspan><tspan class="red-accent bold">S</tspan><tspan class="text-dim"> Sort</tspan><tspan class="text-muted"> · </tspan><tspan class="red-accent bold">M</tspan><tspan class="text-dim"> Mode</tspan><tspan class="text-muted"> · </tspan><tspan class="red-accent bold">T</tspan><tspan class="text-dim"> Time</tspan><tspan class="text-muted"> · </tspan><tspan class="red-accent bold">R</tspan><tspan class="text-dim"> Refresh</tspan><tspan class="text-muted"> · </tspan><tspan class="red-accent bold">Esc/q</tspan><tspan class="text-dim"> Quit</tspan>
  </text>
</svg>
